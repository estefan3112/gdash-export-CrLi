name: macOS Build

on:
  push:
    branches: [ macos, actions-macos-test ]
  pull_request:
    branches: [ macos ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install gettext automake autoconf libtool sdl2 sdl2_mixer sdl2_image \
                       gtk+3 librsvg adwaita-icon-theme dylibbundler

      - name: Build
        run: |
          chmod +x make-all.sh bundle-macos.sh
          ./make-all.sh

      - name: Create GDash.app
        run: ./bundle-macos.sh

      - name: Upload GDash.app
        uses: actions/upload-artifact@v4
        with:
          name: GDash-macos-arm64
          path: build/GDash-macos-arm64.zip

name: macOS Build

on:
  push:
    branches: [ macos, actions-macos-test ]
  pull_request:
    branches: [ macos ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install gettext automake autoconf libtool sdl2 sdl2_mixer sdl2_image \
                       gtk+3 librsvg adwaita-icon-theme dylibbundler

      - name: Build
        run: |
          chmod +x make-all.sh bundle-macos.sh
          ./make-all.sh

      - name: Import Developer ID certificate
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KC" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          [ -n "$ID" ] || { echo "No Developer ID Application identity in certificate"; exit 1; }
          echo "Signing as: $ID"
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Create, sign and notarize GDash.app
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./bundle-macos.sh

      - name: Upload GDash.app
        uses: actions/upload-artifact@v7
        with:
          path: build/GDash-macos-arm64.zip
          # upload our own ditto zip as-is: no extra GitHub zip around it
          # (Archive Utility chokes on GitHub's wrapper zip)
          archive: false
